<!doctype html><html lang="hi"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Raz Ki Duniya — Complete AI Video Maker</title><style>body{font-family:system-ui;background:#0b0b12;color:#fff;margin:0;padding:16px}.box{max-width:760px;margin:auto;background:#151522;padding:18px;border-radius:18px}textarea,input,select,button{width:100%;box-sizing:border-box;margin:7px 0;padding:12px;border-radius:10px;border:1px solid #444;background:#0f0f18;color:#fff}button{background:#7c3aed;border:0;font-weight:700}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.small{opacity:.75;font-size:13px}.ok{color:#5eead4}.err{color:#fb7185}video{width:100%;margin-top:12px;border-radius:12px}</style><div class="box"><h2>🔎 Raz Ki Duniya — Complete AI Video Maker</h2><p class="small">Script → AI visuals → आपकी आवाज़ → subtitles → music → MP4</p><label>Hindi Script</label><textarea id="script" rows="8" placeholder="अपनी पूरी स्क्रिप्ट यहाँ डालें..."></textarea><div class="row"><div><label>Format</label><select id="format"><option value="9:16">9:16 Shorts/Reels</option><option value="16:9">16:9 YouTube</option></select></div><div><label>Style</label><select id="style"><option>Mystery</option><option>Horror</option><option>Historical</option><option>Space</option></select></div></div><label>🎙️ आपकी Voice</label><input id="voice" type="file" accept="audio/*"><label>🎵 Background Music (optional)</label><input id="music" type="file" accept="audio/*"><label>🧑 Talking Character (optional)</label><input id="characterImage" type="file" accept="image/*"><p class="small">Character mode के लिए आगे driving-performance/lip-sync asset भी जोड़ा जा सकता है; यह field character image सुरक्षित रखती है।</p><button onclick="generate()">🚀 AI VIDEO बनाओ</button><div id="status" class="small"></div><div id="preview"></div></div><script>
const s=document.getElementById('status');
async function generate(){s.textContent='AI scenes बन रहे हैं...';const fd=new FormData();fd.append('script',script.value);fd.append('format',format.value);fd.append('style',style.value);if(voice.files[0])fd.append('voice',voice.files[0]);if(music.files[0])fd.append('music',music.files[0]);if(characterImage.files[0])fd.append('characterImage',characterImage.files[0]);let r=await fetch('/api/generate',{method:'POST',body:fd});let j=await r.json();if(!r.ok){s.className='err';s.textContent=j.error;return}let id=j.jobId;let timer=setInterval(async()=>{let q=await fetch('/api/job/'+id);let x=await q.json();s.textContent=`AI scenes: ${x.progress||0}%`;if(x.status==='ready'){clearInterval(timer);s.textContent='Scenes तैयार हैं। अब MP4 render हो रहा है...';let rf=new FormData();rf.append('jobId',id);if(voice.files[0])rf.append('voice',voice.files[0]);if(music.files[0])rf.append('music',music.files[0]);let rr=await fetch('/api/render',{method:'POST',body:rf});let v=await rr.json();if(!rr.ok){s.className='err';s.textContent=v.error;return}s.className='ok';s.textContent='✅ Complete MP4 तैयार है';preview.innerHTML=`<video controls src="${v.video}"></video><a href="${v.video}" download style="color:#fff">⬇️ MP4 Download</a>`}if(x.status==='error'){clearInterval(timer);s.className='err';s.textContent=x.error}},2500)}
fetch('/api/status').then(r=>r.json()).then(x=>{if(!x.runwayConfigured)s.textContent='⚠️ Runway API key अभी server में सेट नहीं है।'});
</script></html>
