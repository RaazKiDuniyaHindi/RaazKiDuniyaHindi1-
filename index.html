<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Raz Ki Duniya — Complete AI Video Maker</title>

<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{
  margin:0;
  background:#09090f;
  color:#f5f5f7;
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
.wrap{
  max-width:900px;
  margin:auto;
  padding:22px;
}
h1{
  margin:0 0 8px;
  font-size:30px;
}
.sub{
  color:#aaa;
  margin-bottom:24px;
}
.card{
  background:#11121a;
  border:1px solid #252633;
  border-radius:16px;
  padding:18px;
  margin-bottom:16px;
}
label{
  display:block;
  margin:14px 0 7px;
  font-weight:600;
}
textarea,select,input[type=file]{
  width:100%;
  background:#0b0c12;
  color:#fff;
  border:1px solid #30313d;
  border-radius:10px;
  padding:12px;
  font:inherit;
}
textarea{
  min-height:190px;
  resize:vertical;
}
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}
button{
  width:100%;
  border:0;
  border-radius:12px;
  padding:14px;
  margin-top:18px;
  background:#fff;
  color:#09090f;
  font-weight:800;
  font-size:16px;
  cursor:pointer;
}
button:disabled{
  opacity:.5;
  cursor:not-allowed;
}
.progress{
  height:12px;
  background:#242530;
  border-radius:20px;
  overflow:hidden;
  margin-top:12px;
}
#bar{
  width:0%;
  height:100%;
  background:#fff;
  transition:width .3s ease;
}
.row{
  display:flex;
  justify-content:space-between;
  gap:12px;
  color:#bbb;
  font-size:14px;
}
#pct{
  color:#fff;
  font-weight:700;
}
#statusText{
  margin-top:12px;
  font-weight:600;
}
#message{
  margin-top:7px;
  color:#aaa;
  font-size:14px;
}
#error{
  color:#ff6b6b;
  margin-top:14px;
  white-space:pre-wrap;
}
#result{
  display:none;
}
video{
  width:100%;
  border-radius:14px;
  background:#000;
  margin-top:12px;
}
.download{
  display:block;
  text-align:center;
  margin-top:14px;
  padding:12px;
  border-radius:10px;
  background:#fff;
  color:#000;
  text-decoration:none;
  font-weight:700;
}
.fileName{
  color:#999;
  font-size:13px;
  margin-top:5px;
}
@media(max-width:650px){
  .grid{grid-template-columns:1fr}
  .wrap{padding:14px}
  h1{font-size:25px}
}
</style>
</head>

<body>

<div class="wrap">

  <h1>🎬 Raz Ki Duniya</h1>
  <div class="sub">Complete AI Video Maker</div>

  <div class="card">

    <label for="script">अपनी कहानी / Script</label>
    <textarea id="script" placeholder="यहाँ अपनी कहानी लिखें..."></textarea>

    <div class="grid">

      <div>
        <label for="format">Video Format</label>
        <select id="format">
          <option value="9:16">9:16 — Shorts / Reels</option>
          <option value="16:9">16:9 — YouTube</option>
        </select>
      </div>

      <div>
        <label for="style">Video Style</label>
        <select id="style">
          <option value="Mystery">Mystery</option>
          <option value="Cinematic">Cinematic</option>
          <option value="Horror">Horror</option>
          <option value="Realistic">Realistic</option>
          <option value="Fantasy">Fantasy</option>
          <option value="Documentary">Documentary</option>
        </select>
      </div>

    </div>

    <label for="characterImage">Character Image (optional)</label>
    <input id="characterImage" type="file" accept="image/*">

    <label for="voice">Voice (optional)</label>
    <input id="voice" type="file" accept="audio/*">
    <div id="voiceName" class="fileName">कोई file नहीं चुनी गई</div>

    <label for="music">Background Music (optional)</label>
    <input id="music" type="file" accept="audio/*">
    <div id="musicName" class="fileName">कोई file नहीं चुनी गई</div>

    <button id="generate">🎬 AI Video Generate करें</button>

    <div style="margin-top:20px">
      <div class="row">
        <span id="statusText">AI scenes: 0%</span>
        <span id="pct">0%</span>
      </div>

      <div class="progress">
        <div id="bar"></div>
      </div>

      <div id="message">तैयार है।</div>
    </div>

    <div id="error"></div>

  </div>

  <div class="card" id="result">

    <h2>🎉 Video तैयार है</h2>

    <video id="video" controls playsinline></video>

    <a id="videoLink" class="download" href="#" target="_blank">
      ⬇️ Video खोलें / Download करें
    </a>

  </div>

</div>

<script>
"use strict";

const $ = id => document.getElementById(id);

let currentJobId = null;

function setProgress(value, msg) {
  value = Math.max(0, Math.min(100, Number(value) || 0));

  $("bar").style.width = value + "%";
  $("pct").textContent = value + "%";
  $("statusText").textContent = "AI scenes: " + value + "%";

  if (msg) {
    $("message").textContent = msg;
  }
}

function fileName(inputId, labelId) {
  $(inputId).addEventListener("change", () => {
    $(labelId).textContent = $(inputId).files[0]
      ? $(inputId).files[0].name
      : "कोई file नहीं चुनी गई";
  });
}

fileName("voice", "voiceName");
fileName("music", "musicName");


/*
 * IMPORTANT:
 * Server अगर JSON की जगह HTML भेजे तो
 * Unexpected token '<' वाली समस्या यहीं साफ दिखाई देगी।
 */
async function readJsonResponse(response, label) {

  const text = await response.text();

  let data;

  try {
    data = JSON.parse(text);
  } catch (error) {

    throw new Error(
      label +
      " ने JSON की जगह HTML/अन्य response भेजा। HTTP " +
      response.status +
      " — " +
      text.slice(0, 300)
    );
  }

  return data;
}


/*
 * Job polling
 */
async function pollJob(jobId) {

  for (;;) {

    const r = await fetch(
      "/api/job/" + encodeURIComponent(jobId),
      {
        cache: "no-store",
        headers: {
          "Accept": "application/json"
        }
      }
    );

    const job = await readJsonResponse(
      r,
      "Job status server"
    );

    if (!r.ok) {
      throw new Error(
        job.error ||
        "Job status request failed. HTTP " + r.status
      );
    }

    if (job.status === "error") {
      throw new Error(
        job.error ||
        "AI generation failed."
      );
    }

    setProgress(
      job.progress,
      job.message || "AI scenes बन रहे हैं…"
    );

    if (job.status === "ready") {

      setProgress(
        76,
        "AI scenes तैयार हैं। Final MP4 बनाया जा रहा है…"
      );

      return job;
    }

    if (job.status === "done") {
      return job;
    }

    await new Promise(
      resolve => setTimeout(resolve, 2500)
    );
  }
}


/*
 * Generate button
 */
$("generate").onclick = async () => {

  $("error").textContent = "";
  $("result").style.display = "none";

  const script = $("script").value.trim();

  if (!script) {
    $("error").textContent =
      "पहले script डालें।";
    return;
  }

  const btn = $("generate");

  btn.disabled = true;

  setProgress(
    1,
    "Server को request भेजी जा रही है…"
  );

  try {

    /*
     * Generate request
     */
    const fd = new FormData();

    fd.append("script", script);
    fd.append("format", $("format").value);
    fd.append("style", $("style").value);

    if ($("voice").files[0]) {
      fd.append(
        "voice",
        $("voice").files[0]
      );
    }

    if ($("music").files[0]) {
      fd.append(
        "music",
        $("music").files[0]
      );
    }

    if ($("characterImage").files[0]) {
      fd.append(
        "characterImage",
        $("characterImage").files[0]
      );
    }


    const response = await fetch(
      "/api/generate",
      {
        method: "POST",
        body: fd,
        headers: {
          "Accept": "application/json"
        }
      }
    );

    const data = await readJsonResponse(
      response,
      "Generate server"
    );

    if (!response.ok) {
      throw new Error(
        data.error ||
        "Generate request failed. HTTP " +
        response.status
      );
    }

    if (!data.jobId) {
      throw new Error(
        "Server ने jobId नहीं भेजा।"
      );
    }

    currentJobId = data.jobId;

    setProgress(
      2,
      `${data.sceneCount || ""} AI scenes के लिए generation शुरू हो गई है…`
    );


    /*
     * Wait for AI scenes
     */
    const job = await pollJob(
      currentJobId
    );


    /*
     * Final render request
     */
    const renderFd = new FormData();

    renderFd.append(
      "jobId",
      currentJobId
    );

    if ($("voice").files[0]) {
      renderFd.append(
        "voice",
        $("voice").files[0]
      );
    }

    if ($("music").files[0]) {
      renderFd.append(
        "music",
        $("music").files[0]
      );
    }

    setProgress(
      80,
      "Final MP4 render हो रहा है…"
    );


    const renderResponse = await fetch(
      "/api/render",
      {
        method: "POST",
        body: renderFd,
        headers: {
          "Accept": "application/json"
        }
      }
    );

    const renderData = await readJsonResponse(
      renderResponse,
      "Render server"
    );

    if (!renderResponse.ok) {
      throw new Error(
        renderData.error ||
        "Render failed. HTTP " +
        renderResponse.status
      );
    }

    if (!renderData.video) {
      throw new Error(
        "Server ने video URL नहीं भेजा।"
      );
    }


    /*
     * Finished
     */
    setProgress(
      100,
      "वीडियो तैयार है!"
    );

    $("video").src =
      renderData.video;

    $("videoLink").href =
      renderData.video;

    $("result").style.display =
      "block";

    $("result").scrollIntoView({
      behavior: "smooth"
    });

  } catch (e) {

    console.error(
      "VIDEO GENERATION ERROR:",
      e
    );

    $("error").textContent =
      "❌ " +
      (e.message || e);

    setProgress(
      0,
      "Generation रुक गई।"
    );

  } finally {

    btn.disabled = false;
  }
};
</script>

</body>
</html>
